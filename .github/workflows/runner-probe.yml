name: runner-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Specs voor en na opruimen
        run: |
          echo "== cpu =="; nproc; grep -m1 'model name' /proc/cpuinfo
          echo "== ram =="; free -g | head -2
          echo "== disk =="; df -h / | tail -1
          echo "== java =="; java -version 2>&1 | head -2
          echo "== android sdk aanwezig =="; du -sh /usr/local/lib/android 2>/dev/null
          echo "== opruimen (dotnet, ghc, CodeQL, android sdk) =="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "== disk na opruimen =="; df -h / | tail -1
          echo "== chromium bron nodig =="; echo "gclient sync (full): ~40 GB checkout + ~40 GB build dir"
