name: build-android

# Android-build via GitHub Actions, langs het eigen pad van deze repo
# (version.sh-stappen + setup.sh --android + arm/android/arm64_args.gn + autoninja).
#
# Gemeten op de runner (2026-10-13), per poging:
#   run 1: volledige-historie fetch + sync -> schijf vol (113 GB) na 95 min.
#   run 2: `fetch` maakt zelf geen map: boom landde in ~/src i.p.v. ~/chromium/src.
#   run 3: fetch/deps/tag/sync/setup allemaal groen (pre-build ~45 min, 76 GB gebruikt,
#          69 GB vrij) -> setup.sh exit 2 op `tput sgr0` met lege $TERM.
#   run 4: gn gen faalt: `checkout_android` ontbreekt -> .gclient mist target_os=["android"].
#          Tweede job sneuvelde op HTTP 429 van chromium.googlesource.com (twee syncs
#          tegelijk vanaf hetzelfde IP).
# Deze versie: fetch met --target_os=android + vangnet in .gclient, TERM=xterm,
# jobs na elkaar i.p.v. naast elkaar (max-parallel: 1), retry op de netwerkstappen.
#
# Blijft staan: 4 vCPU en een harde 6-uurslimiet per job, een koude
# Chromium-Android-build is 10-20 u. Deze run MEET per fase; hij belooft geen APK.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  apk:
    name: android ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TERM: xterm   # setup.sh eindigt met `tput sgr0`; zonder TERM geeft dat exit 2
    strategy:
      fail-fast: false
      max-parallel: 1   # nooit twee syncs tegelijk: googlesource geeft anders 429
      matrix:
        include:
          # "fast" eerst: zonder LTO/official/PGO is dit de enige variant die op
          # 4 vCPU binnen de limiet kán landen.
          - profile: fast
            minutes: "240"
          - profile: repo
            minutes: "150"

    steps:
      - name: 0. Schijf maximaal vrijmaken
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/az /usr/share/swift \
                      /usr/local/share/boost /usr/local/.ghcup /usr/local/lib/node_modules \
                      /opt/hostedtoolcache "$AGENT_TOOLSDIRECTORY" || true
          docker image prune -af || true
          df -h / | tee -a "$HOME/timings.txt"
          echo "vCPU: $(nproc) | RAM: $(free -g | awk '/Mem:/{print $2}') GB"

      - name: 1. Basis + deze repo + depot_tools
        run: |
          set -e
          stage() { echo "$(date -u +%FT%TZ) $*" | tee -a "$HOME/timings.txt"; }
          stage "start"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git curl lsb-release file python3 python3-pip
          git clone -q --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          git clone -q --recurse-submodules https://github.com/${{ github.repository }}.git "$HOME/roansbrowser"
          cp -v "$HOME/roansbrowser/depot_tools/autoninja" "$HOME/depot_tools/autoninja"
          VER=$(grep -oP 'THOR_VER="\K[^"]+' "$HOME/roansbrowser/version.sh")
          echo "VER=$VER" >> "$GITHUB_ENV"
          stage "depot_tools + repo klaar (Chromium tag $VER)"

      - name: 2. Chromium fetchen voor Android (shallow, ~10 min)
        run: |
          set -e
          export PATH="$HOME/depot_tools:$PATH"
          stage() { echo "$(date -u +%FT%TZ) $*" | tee -a "$HOME/timings.txt"; }
          mkdir -p "$HOME/chromium"
          cd "$HOME/chromium"
          stage "fetch chromium start (--no-history, --target_os=android)"
          fetch --nohooks --no-history chromium --target_os=android
          stage "fetch chromium klaar"
          test -d "$HOME/chromium/src" || { echo "::error::geen checkout op $HOME/chromium/src"; exit 1; }
          # Vangnet: zonder target_os=["android"] in .gclient faalt `gn gen` op
          # build/config/android/config.gni (assert checkout_android).
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path.home() / "chromium/.gclient"
          t = p.read_text()
          if "target_os" not in t:
              t += '\ntarget_os = ["android"]\n'
              p.write_text(t)
              print("target_os toegevoegd aan .gclient")
          else:
              print("target_os stond al in .gclient")
          print("----- .gclient -----"); print(t)
          PY
          ls -d "$HOME/chromium/.gclient"
          du -sh "$HOME/chromium/src" | tee -a "$HOME/timings.txt"
          df -h / | tail -1 | tee -a "$HOME/timings.txt"

      - name: 3. Build-deps (Android) installeren
        run: |
          cd "$HOME/chromium/src" || exit 0
          stage() { echo "$(date -u +%FT%TZ) $*" | tee -a "$HOME/timings.txt"; }
          stage "install-build-deps start"
          set +e
          sudo ./build/install-build-deps.sh --android --no-prompt 2>&1 | tail -30
          RC=$?
          if [ "$RC" != "0" ]; then
            stage "eerste poging faalde ($RC), opnieuw met --unsupported"
            sudo ./build/install-build-deps.sh --android --no-prompt --unsupported 2>&1 | tail -30
            RC=$?
          fi
          stage "install-build-deps klaar (exit $RC)"

      - name: 4. Chromium op de repo-tag + gclient sync (stappen uit version.sh)
        run: |
          set -e
          CR="$HOME/chromium/src"
          stage() { echo "$(date -u +%FT%TZ) $*" | tee -a "$HOME/timings.txt"; }
          retry() {  # $1 = aantal pogingen, daarna het commando
            n="$1"; shift
            for i in $(seq 1 "$n"); do
              "$@" && return 0
              stage "poging $i/$n faalde, 60s wachten"
              sleep 60
            done
            return 1
          }
          cd "$CR"
          stage "tag $VER ophalen"
          retry 3 git fetch --depth=1 origin "refs/tags/$VER:refs/tags/$VER"
          git checkout -f "tags/$VER"
          stage "HEAD: $(git log -1 --format='%h %cd %s')"
          cd "$HOME/roansbrowser"
          cp -v src/build/vs_toolchain.py "$CR/build/"
          cp -v libjxl/src/DEPS "$CR/"
          cp -v libjxl/src/.gitmodules "$CR/"
          cp -v libjxl/src/third_party/.gitignore "$CR/third_party/"
          cd "$CR"
          export PATH="$HOME/depot_tools:$PATH"
          SHALLOW=""
          if gclient sync --help 2>&1 | grep -q -- '--no-history'; then SHALLOW="--no-history"; fi
          stage "gclient sync start (shallow='$SHALLOW', target_os=android)"
          retry 3 gclient sync --force --reset --nohooks --delete_unversioned_trees $SHALLOW
          stage "gclient sync klaar"
          retry 2 gclient runhooks
          retry 2 build/linux/sysroot_scripts/install-sysroot.py --arch=amd64
          stage "version-stappen klaar"
          grep -n "checkout_android" build/config/gclient_args.gni || true
          ls -d third_party/android_sdk third_party/android_ndk 2>/dev/null || echo "::warning::geen android_sdk/ndk in third_party"
          du -sh "$CR" "$HOME/.cipd" 2>/dev/null || true
          df -h / | tail -1 | tee -a "$HOME/timings.txt"

      - name: 5. setup.sh --android
        run: |
          set -e
          stage() { echo "$(date -u +%FT%TZ) $*" | tee -a "$HOME/timings.txt"; }
          cd "$HOME/roansbrowser"
          # Dode regel in het script zelf: `cp -r -v arm/build/*` — die map bestaat ook
          # upstream niet, en omdat de rest van copyAndroid() een &&-keten is, werden
          # arm/third_party/*, arm/android/* (iconen) en de Android-PGO-download stil
          # overgeslagen. Die regel vervangen door een no-op.
          sed -i -e '\#cp -r -v arm/build/\*#c\true &&' setup.sh
          grep -n '^true &&' setup.sh
          stage "setup.sh --android start"
          ./setup.sh --android
          stage "setup.sh klaar"
          ls -lh "$HOME/chromium/src"/chrome/build/pgo_profiles/chrome-android64-*.profdata 2>/dev/null || echo "geen PGO-profiel"
          df -h / | tail -1 | tee -a "$HOME/timings.txt"

      - name: 6. Ruimte vrijmaken voor de build + args.gn + gn gen
        run: |
          set -e
          CR="$HOME/chromium/src"
          OUT="$CR/out/roansbrowser"
          PROF="${{ matrix.profile }}"
          stage() { echo "$(date -u +%FT%TZ) $*" | tee -a "$HOME/timings.txt"; }
          rm -rf "$HOME/.cipd" 2>/dev/null || true
          FREE=$(df -Pk / | awk 'NR==2{print int($4/1024/1024)}')
          stage "vrij voor de build: ${FREE} GB"
          if [ "$FREE" -lt 60 ]; then
            stage "weinig ruimte: git-metadata opruimen (de build heeft geen historie nodig)"
            find "$CR" -maxdepth 4 -name .git -prune -exec rm -rf {} + 2>/dev/null || true
            FREE=$(df -Pk / | awk 'NR==2{print int($4/1024/1024)}')
            stage "vrij na opruimen: ${FREE} GB"
          fi
          mkdir -p "$OUT"
          cp "$HOME/roansbrowser/arm/android/arm64_args.gn" "$OUT/args.gn"
          sed -i "s|/home/alex/chromium/src|$CR|g" "$OUT/args.gn"
          PGO=$(ls -t "$CR"/chrome/build/pgo_profiles/chrome-android64-*.profdata 2>/dev/null | head -1)
          if [ -n "$PGO" ]; then
            sed -i "s|^pgo_data_path = .*|pgo_data_path = \"$PGO\"|" "$OUT/args.gn"
          else
            sed -i "/^pgo_data_path = /d" "$OUT/args.gn"
            sed -i "s|^chrome_pgo_phase = .*|chrome_pgo_phase = 0|" "$OUT/args.gn"
            echo "::warning::geen android64 PGO-profiel gevonden, chrome_pgo_phase=0"
          fi
          if [ "$PROF" = "fast" ]; then
            printf '%s\n' \
              '# --- profiel "fast": geen LTO/official, alleen om de bouwtijd te meten ---' \
              'is_official_build = false' \
              'use_thin_lto = false' \
              'chrome_pgo_phase = 0' \
              'v8_enable_maglev = false' \
              'is_high_end_android = false' >> "$OUT/args.gn"
          fi
          echo "===== args.gn ($PROF) ====="
          grep -v -E '^[[:space:]]*$' "$OUT/args.gn" | tee "$HOME/args-$PROF.gn"
          cd "$CR"
          export PATH="$HOME/depot_tools:$PATH"
          stage "gn gen start"
          gn gen out/roansbrowser 2>&1 | tee "$HOME/gn-$PROF.log"
          stage "gn gen klaar"
          df -h / | tail -1 | tee -a "$HOME/timings.txt"

      - name: 7. Bouwen (stopt op de limiet, logt de voortgang)
        continue-on-error: true
        run: |
          cd "$HOME/chromium/src"
          export PATH="$HOME/depot_tools:$PATH"
          export NINJA_SUMMARIZE_BUILD=1
          export NINJA_STATUS="[%r running, %f/%t @ %o/s | %e sec ] "
          MINS="${{ matrix.minutes }}"
          echo "$(date -u +%FT%TZ) ninja start (chrome_public_apk, limiet ${MINS}m)" | tee -a "$HOME/timings.txt"
          ( while true; do
              sleep 900
              echo "--- $(date -u +%FT%TZ) hartslag: out/ = $(du -sh out/roansbrowser 2>/dev/null | cut -f1) | vrij: $(df -h / | tail -1 | awk '{print $4}')"
              tail -c 400 "$HOME/ninja.log" 2>/dev/null | tr '\r' '\n' | tail -2
            done ) &
          HEART=$!
          set -o pipefail
          timeout -s INT "${MINS}m" autoninja -C out/roansbrowser chrome_public_apk -j"$(nproc)" 2>&1 | tee "$HOME/ninja.log"
          RC=$?
          kill $HEART 2>/dev/null || true
          echo "$(date -u +%FT%TZ) ninja gestopt, exit $RC (124 = limiet gehaald)" | tee -a "$HOME/timings.txt"
          tr '\r' '\n' < "$HOME/ninja.log" | tail -5
          df -h / | tail -1 | tee -a "$HOME/timings.txt"
          ls -lh out/roansbrowser/apks/*.apk 2>/dev/null || echo "nog geen APK"

      - name: 8. Metingen + eventuele APK uploaden
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metingen-${{ matrix.profile }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            /home/runner/timings.txt
            /home/runner/ninja.log
            /home/runner/gn-${{ matrix.profile }}.log
            /home/runner/args-${{ matrix.profile }}.gn
            /home/runner/chromium/src/out/roansbrowser/apks/*.apk